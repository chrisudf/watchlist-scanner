# 左右侧扫描器 watchlist
#
# value_zone = [低, 高] 是"愿意接货"的价值区 — 你的判断, 手工维护。
# 不设 zone 的标的: 左侧建议(LEFT_ZONE/CSP 接货锚)不启用, 只出技术面/右侧信号。
# PE-band 表 / sec 分析器的交易区间产出可以直接填进来。
#
# 2026-09-05 全量校准 (基准 = 2026-09-04 收盘, 15 标的逐个实查 + 交叉复核):
#   高 = 第一档接货价 (现价下方约 5-15%, 强支撑上沿/合理估值下缘)
#   低 = 深接货档 (bear-case 估值/重大支撑, 现价下方 15-30%); high_beta 给宽给深
#   宏观: 9/16 FOMC (定价 ~66% 加息) + 中期选举 8-10 月弱势窗口 → 全部宁深勿浅
#   zone_asof = 校准日期 (腐烂检测用: 超龄/漂移/拆股基准) — 重锚时记得同步更新
#
# 2026-09-18 增补 AMZN / META (基准 = 当日收盘, 未动其余 15 标的):
#   注: zone_asof 按 ET 校验 — 布里斯班这边已是 9/19, 填 9/19 会被
#   load_config 当成"未来日期"拒掉; 写 ET 交易日
#   宏观已变 — 9/16 FOMC 加息 25bp 到 3.75-4.00% (12-0, 2023年7月以来首次),
#   点阵图 16/18 认为还要再加一次, 年底 4.1-4.4% → 长久期成长股估值端持续承压,
#   9/05 定的"宁深勿浅"继续适用, 这两个新标的的 zone 按同一尺度给
#
# 2026-10-16 全量复核 (基准 = 2026-10-16 收盘, 17 标的逐个实查; zone_asof 统一 2026-10-16):
#   背景: QQQ 10/6 ATH 762.86 → 10/16 709.80 (-7.0%), SMH 一周 -10.5%
#     · 10/12 Broadcom Hock Tan / Intel Lip-Bu Tan 称资本才是 AI 的瓶颈 (9 月 AI 相关发债不到
#       8 月一半) → AI 硬件/光模块杀估值; 同日长鑫 (CXMT) 发布更高密度服务器 DRAM → 存储一周蒸发约 1 万亿美元
#     · 10/14 九月 CPI 3.7% / 核心 2.6% 双超预期, 10 年期盘中 5.30% (10/16 收 5.10%), 美元指数 52 周新高
#     · 联储 3.75-4.00% (9/16 加息), 10/27-28 FOMC 加息概率在 16-54% 之间来回, 12 月加息已定价约 89%;
#       11/3 中期选举; VIX 20 / VVIX 112 (>=110 扫描器停开新 CSP)
#   原则不变: 宁深勿浅, 只在结构真变了的地方重锚 —
#     上移 5 只: MSFT/AAPL/ISRG/META 新高或强反弹让旧上沿落到现价下方 14-21%, 漂移提醒已贴线或已越线;
#       TSM 是 FY27 EPS 上修, 下沿 15x 跟着抬高; 新上沿都在现价下方 5-17%, 倍数不超过近年区间中下段
#     下移 6 只: 破位后旧带上半段成了阻力/缺口 — RKLB/SOFI/COHR/DRAM 旧下沿 ≈ 新上沿,
#       下方补一档深档; HOOD/GLD 上沿从阻力挪到最近的支撑
#     数值不动 6 只 QQQ/NVDA/GOOG/TSLA/AMZN/SPCX: 复核后锚点仍成立, 只更新 notes 和 zone_asof
#   DRAM / SPCX 期权链已核实可用 (CBOE 延迟链) → 撤掉 options = false; DRAM 补 high_beta
#   财报 (ET; ? = 公司未公告, 取 Yahoo 或推断):
#     ISRG 10/20 盘后 · SPCX 10/20? · TSLA / META 10/21 盘后 · SOFI 10/27 盘前 · HOOD 10/27 盘后 ·
#     MSFT 10/28 盘后 · GOOG 10/28? · AMZN 10/29 盘后 · AAPL 11/2 盘后 · COHR 11/4 盘后 ·
#     RKLB ~11/10? · NVDA ~11/17-18?
#   注: 报告里的「下次财报」对盘后发布的会晚一天 (yfinance calendar 按本机布里斯班时区换算
#     20:00 UTC), 正好等于价格反应日, 不跨财报的到期日筛选仍然正确
#
# 2026-10-19 增补 MSTR (未动其余 17 标的): 不设 value_zone, 只出技术面/右侧信号 —
#   接货阶梯走 [mnav.MSTR] (mnav.py, 三档按当天 BTC 换算); 进 [tickers] 是让 mNAV 段用扫描器自己的收盘
#
# kind = "index" | "stock" | "etf"   (LEAP delta 带: index 0.70-0.80, 其余 0.75-0.85)
# high_beta = true  → LEAP 提示仓位折半 + 财报后入场
# options = false   → 不出期权票 (无链/流动性差)

[settings]
gap_alert_pct = 1.5
volume_surge = 1.5
near_zone_pct = 5.0

